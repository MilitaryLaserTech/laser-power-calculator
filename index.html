<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Calculator Putere Laser</title>
  <style>
    body { font-family: sans-serif; padding:20px; max-width: 400px; margin: auto; }
    select, button { width: 100%; padding: 8px; margin-top: 10px; }
    #result { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h3>🔍 Laser Power Calculator</h3>
  <label for="material">Material:</label>
  <select id="material" onchange="populateThickness()">
    <option>Carbon Steel</option>
    <option>Stainless Steel</option>
    <option>Aluminium</option>
    <option>Brass</option>
  </select>

  <label for="thickness">Grosime (mm):</label>
  <select id="thickness"></select>

  <button onclick="calculatePower()">Calculate Now</button>

  <p id="result"></p>

  <script>
    const table = {
      "Carbon Steel": {10:1000,14:1500,16:2000,20:3000,22:4000,25:6000,30:8000,40:12000},
      "Stainless Steel": {4:1000,6:1500,8:2000,10:3000,12:4000,16:6000,30:8000},
      "Aluminium": {3:1000,4:2000,6:3000,8:4000,12:6000,25:8000,30:12000},
      "Brass": {2:1000,3:1500,4:2000,5:3000,6:4000,8:6000,12:8000,14:12000}
    };

    function populateThickness() {
      const mat = document.getElementById("material").value;
      const sel = document.getElementById("thickness");
      sel.innerHTML = "";
      const thicknesses = Object.keys(table[mat]).map(Number).sort((a,b) => a-b);
      thicknesses.forEach(n => {
        let option = new Option(n + " mm", n);
        sel.add(option);
      });
      if (thicknesses.length > 0) sel.value = thicknesses[0];
    }

    function calculatePower() {
      const mat = document.getElementById("material").value;
      const t = +document.getElementById("thickness").value;
      let power = null;
      for (let limit of Object.keys(table[mat]).map(Number).sort((a,b) => a-b)) {
        if (t <= limit) {
          power = table[mat][limit];
          break;
        }
      }
      document.getElementById("result").textContent = power
        ? `✅ Putere minimă necesară: ${power} W`
        : `⚠️ Grosime prea mare pentru acest material.`;
    }

    window.addEventListener("DOMContentLoaded", populateThickness);
  </script>
</body>
</html>
