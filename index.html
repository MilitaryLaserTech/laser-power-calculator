<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Calculator Putere Laser</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      background: linear-gradient(135deg, #2c3e50, #34495e);
      color: #ecf0f1;
    }
    h3 {
      margin-bottom: 25px;
      font-weight: 800;
      font-size: 1.8rem;
      color: #b4d48c;
      text-shadow: 0 0 8px #7a9a40, 0 0 6px #5b7a30;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    select, button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }
    select {
      background-color: #7a8b59;
      color: #f0f0f0;
    }
    select option {
      background-color: #7a8b59;
      color: #f0f0f0;
    }
    button {
      background-color: #5b7a30;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #7a9a40;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h3>⚡ Calculate the minimum laser power required,<br>based on material type and thickness.</h3>

  <label for="material">🧱 Material:</label>
  <select id="material" onchange="populateThickness()">
    <option>Carbon Steel</option>
    <option>Stainless Steel</option>
    <option>Aluminium</option>
    <option>Brass</option>
  </select>

  <label for="thickness">📏 Thickness (mm):</label>
  <select id="thickness"></select>

  <button onclick="calculatePower()">🚀 Calculate Now</button>

  <p id="result"></p>

  <script>
    const table = {
      "Carbon Steel": {10:1000,14:1500,16:2000,20:3000,22:4000,25:6000,30:8000,40:12000},
      "Stainless Steel": {4:1000,6:1500,8:2000,10:3000,12:4000,16:6000,30:8000},
      "Aluminium": {3:1000,4:2000,6:3000,8:4000,12:6000,25:8000,30:12000},
      "Brass": {2:1000,3:1500,4:2000,5:3000,6:4000,8:6000,12:8000,14:12000}
    };

    function populateThickness() {
      const mat = document.getElementById("material").value;
      const sel = document.getElementById("thickness");
      sel.innerHTML = "";
      const thicknesses = Object.keys(table[mat]).map(Number).sort((a,b) => a-b);
      thicknesses.forEach(n => {
        let option = new Option(n + " mm", n);
        sel.add(option);
      });
      if (thicknesses.length > 0) sel.value = thicknesses[0];
    }

    function calculatePower() {
      const mat = document.getElementById("material").value;
      const t = +document.getElementById("thickness").value;
      let power = null;
      for (let limit of Object.keys(table[mat]).map(Number).sort((a,b) => a-b)) {
        if (t <= limit) {
          power = table[mat][limit];
          break;
        }
      }
      document.getElementById("result").textContent = power
        ? `✅ Minimum required power: ${power} W`
        : `⚠️ Thickness exceeds supported range for this material.`;
    }

    window.addEventListener("DOMContentLoaded", populateThickness);
  </script>
</body>
</html>
